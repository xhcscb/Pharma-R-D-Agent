name: pharma-analyst-data

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/app/data
    - ./manifests:/app/manifests:ro
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    profiles: [core, full]
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    command: ["uvicorn", "pharma_data.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    <<: *app
    profiles: [core, full]
    command: ["python", "-m", "pharma_data.orchestration.worker"]

  postgres:
    image: pgvector/pgvector:pg17
    profiles: [core, full]
    environment:
      POSTGRES_DB: pharma
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: pharma
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharma"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    profiles: [graph, full]
    environment:
      NEO4J_AUTH: neo4j/change-me-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: [vector, full]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus-etcd-data:/etcd

  milvus-minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    profiles: [vector, full]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - milvus-minio-data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    profiles: [vector, full]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on: [milvus-etcd, milvus-minio]
    volumes:
      - milvus-data:/var/lib/milvus

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg17
    profiles: [timeseries, full]
    environment:
      POSTGRES_DB: pharma_timeseries
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: pharma
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    profiles: [search, full]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  postgres-data:
  neo4j-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  timescale-data:
  elasticsearch-data:
