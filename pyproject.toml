[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pharma-analyst-data"
version = "0.2.0"
description = "Provenance-first data layer for a pharmaceutical equity-research agent platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "beautifulsoup4>=4.12,<5",
  "elasticsearch>=8.17,<9",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "lxml>=5.3,<6",
  "neo4j>=5.27,<6",
  "openpyxl>=3.1,<4",
  "pint>=0.24,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymilvus>=2.5,<3",
  "pymupdf>=1.25,<2",
  "python-dateutil>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "strawberry-graphql[fastapi]>=0.257,<1",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
audio = [
  "faster-whisper>=1.1,<2",
  "pyannote.audio>=3.3,<4",
]
documents = [
  "docling>=2.20,<3",
  "paddleocr>=3,<4",
]
ml = [
  "transformers>=4.48,<5",
  "torch>=2.5,<3",
]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
datactl = "pharma_data.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pharma_data"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires local infrastructure",
  "e2e: end-to-end pipeline test",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["pharma_data"]

[tool.coverage.report]
fail_under = 75
